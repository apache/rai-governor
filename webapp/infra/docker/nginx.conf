# A browser navigation to a path that is both a page of the app and an API
# path (the API has no /api prefix): a reload of /agents, /chat, /admin,
# /echo or /demos/<id>, or a link to one opened in a new tab. It is a GET
# that asks for HTML, and gets index.html; fetch and XHR don't ask for HTML
# and reach the API. Mirrored in webui/src/config/spaNavigation.js for the
# dev server: change both together.
map "$request_method $uri $http_accept" $spa_navigation {
    default 0;
    "~^GET /(agents|chat|admin|echo|demos/[^/]+)/? .*text/html" 1;
}

server {
    listen 80;
    charset utf-8;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA. In production Apache sets
    # X-Content-Type-Options, X-Frame-Options and Referrer-Policy too
    # (replacing these); the CSP is only here.
    #
    # The CSP leaves scripts, styles and connections alone: demo apps run
    # generated HTML with inline scripts in a srcdoc iframe, which inherits
    # this policy, so script-src 'self' would break every demo. Restricting
    # scripts waits on serving demos from their own origin.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    if ($spa_navigation) {
        rewrite ^ /index.html last;
    }

    # The app's page. It varies by Accept (see $spa_navigation), and a
    # browser must not answer a later API call to the same path from a
    # cached copy, so it is revalidated each time. The add_header lines
    # replace the server-level ones here, so those are repeated.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Vary "Accept" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Proxy API paths to the api container. The api routes are mounted at
    # the FastAPI root (no /api prefix), so we route each top-level prefix
    # explicitly. Add to this list when new top-level routers are mounted
    # in app_factory.py.
    #
    # Note: the api's GET "/" endpoint is intentionally NOT proxied because
    # the SPA needs `/` to serve index.html. That endpoint becomes
    # unreachable through the proxy; access via internal docker network only.
    location ~ ^/(auth|admin|agents|chat|data-store|demos|deployments|echo|health|log|mcp|memory|pipelines|providers|rest|runs|sessions|specs|users|workloads)(/|$) {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection '';

        # SSE / streaming support
        proxy_buffering off;
        proxy_cache off;

        # API responses carry user data: no browser or proxy keeps them.
        # An add_header here replaces the server-level ones for this
        # location, so nosniff is repeated.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Deny access to dotfiles (e.g., .env, .git, .gitignore)
    location ~ /\. {
        return 404;
    }

    # Deny access to sensitive file types (defense-in-depth)
    location ~ \.(sql|log|bak|sh|py|ini|yaml|yml|conf)$ {
        return 404;
    }

    # SPA fallback for everything else (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
