# website/ is intentionally not watched: the Docusaurus site is built and
# deployed from upstream, not from this fork.
#
# requirements.lock is not maintained by Dependabot — the pip ecosystem does not
# recognise that filename. Regenerate it on any pip update before CI's drift
# check will pass:
#
#   cd webapp/packages/api/user-service
#   uv pip compile requirements.txt --universal --python-version 3.12 \
#     --no-header -o requirements.lock
#
# Switch the pip block to versioning-strategy: lockfile-only once the lock is
# recognised, either renamed to requirements-lock.txt or migrated to
# pyproject.toml plus uv.lock with the uv ecosystem.

version: 2

updates:
  - package-ecosystem: pip
    directory: /webapp/packages/api/user-service
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    versioning-strategy: increase
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    ignore:
      # fastmcp 4.0 removed fastmcp.tools.tool, imported by mcp_client_service
      # and remote_mcp_client.
      - dependency-name: fastmcp
        versions:
          - ">=4"
      # litellm 1.106.0 imports mcp.types.CacheableResult, which no released
      # mcp provides.
      - dependency-name: litellm
        versions:
          - ">=1.106"
    groups:
      python-test-tooling:
        patterns:
          - pytest*
          - factory_boy
          - faker
          - Faker
        update-types:
          - minor
          - patch
      python-minor-and-patch:
        patterns:
          - "*"
        # Excluded packages carry documented bounds in requirements.txt and get
        # individual pull requests.
        exclude-patterns:
          - litellm
          - fastmcp
          - certifi
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /webapp/infra/docker
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    ignore:
      # An interpreter change requires requirements.lock to be regenerated for
      # the new version.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Build images track even-numbered LTS releases.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    # Transitive updates are handled by regenerating pnpm-lock.yaml.
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    ignore:
      # pnpm's version comes from the packageManager field in
      # webapp/package.json; a bump must land with the lockfile.
      - dependency-name: pnpm
        update-types:
          - version-update:semver-major
    groups:
      js-build-and-test-tooling:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"
          - "@vitest/*"
          - jsdom
          - eslint*
          - "@eslint/*"
          - postcss*
          - browserslist
        update-types:
          - minor
          - patch
      js-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webapp/packages/webui
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    ignore:
      # Shipped to the browser; majors reviewed individually.
      - dependency-name: react-router
        update-types:
          - version-update:semver-major
      - dependency-name: react-router-dom
        update-types:
          - version-update:semver-major
      # @vitejs/plugin-react 6.x peers vite ^8.0.0; this tree is on vite 7.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      # @vitest/ui and @vitest/coverage-v8 peer-require an exact vitest
      # version, so the three move together or not at all.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/ui"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/coverage-v8"
        update-types:
          - version-update:semver-major
    groups:
      webui-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Not grouped: the ASF allowlist permits third-party actions only at approved
  # SHAs, and an unapproved SHA fails the workflow at startup. Individual pull
  # requests isolate which bump is at fault. Approved list is actions.yml in
  # apache/infrastructure-actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
