# requirements.lock is not maintained by Dependabot; the pip ecosystem does not
# recognise that filename. Refresh it by hand:
#
#   cd webapp/packages/api/user-service
#   uv pip compile requirements.txt --universal --python-version 3.12 \
#     --no-header --upgrade -o requirements.lock

version: 2

updates:
  - package-ecosystem: pip
    directory: /webapp/packages/api/user-service
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    # Ranges are open-ended and the lock pins versions; only raise a bound
    # when a new release falls outside it.
    versioning-strategy: increase-if-necessary
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    ignore:
      # fastmcp 4.0 removed fastmcp.tools.tool, imported by mcp_client_service
      # and remote_mcp_client.
      - dependency-name: fastmcp
        versions:
          - ">=4"
      # litellm 1.106.0 imports mcp.types.CacheableResult, which no released
      # mcp provides.
      - dependency-name: litellm
        versions:
          - ">=1.106"

  - package-ecosystem: docker
    directory: /webapp/infra/docker
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
    ignore:
      # An interpreter change requires requirements.lock to be regenerated for
      # the new version.
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Build images track even-numbered LTS releases.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  # Covers all workspace packages; pnpm-lock.yaml lives here. A block pointed
  # at packages/webui updates package.json without the lockfile and fails CI.
  - package-ecosystem: npm
    directory: /webapp
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    # Transitive updates are handled by regenerating pnpm-lock.yaml.
    allow:
      - dependency-type: direct
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    ignore:
      # pnpm's version comes from the packageManager field in
      # webapp/package.json; a bump must land with the lockfile.
      - dependency-name: pnpm
        update-types:
          - version-update:semver-major
      # Shipped to the browser; majors reviewed individually.
      - dependency-name: react-router
        update-types:
          - version-update:semver-major
      - dependency-name: react-router-dom
        update-types:
          - version-update:semver-major
      # MUI majors require a migration across webui.
      - dependency-name: "@mui/*"
        update-types:
          - version-update:semver-major
      # @vitejs/plugin-react 6.x peers vite ^8.0.0; this tree is on vite 7.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      # @vitest/ui and @vitest/coverage-v8 peer-require an exact vitest
      # version, so the three move together or not at all.
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/ui"
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/coverage-v8"
        update-types:
          - version-update:semver-major
    groups:
      js-build-and-test-tooling:
        patterns:
          - vite
          - vitest
          - "@vitejs/*"
          - "@vitest/*"
          - jsdom
          - eslint*
          - "@eslint/*"
          - postcss*
          - browserslist
        update-types:
          - minor
          - patch
      js-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # The Docusaurus docs site, published to GitHub Pages by build-site.yml.
  # Nothing here ships in the app, so minor and patch bumps go in one PR.
  # The overrides in website/package.json are not updated by Dependabot;
  # raise them by hand when an alert names an overridden package.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
    ignore:
      # With the v4 future flag, Docusaurus 3.10 needs @docusaurus/faster;
      # move Docusaurus by hand. All @docusaurus/* packages must match.
      - dependency-name: "@docusaurus/*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      website-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Not grouped: the ASF allowlist permits third-party actions only at approved
  # SHAs, and an unapproved SHA fails the workflow at startup. Individual pull
  # requests isolate which bump is at fault. Approved list is actions.yml in
  # apache/infrastructure-actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: America/Los_Angeles
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
