name: Build and Deploy Site

# Builds the Docusaurus docs site on pull requests that touch it, and builds
# and publishes it to the gh-pages branch on pushes to main.
# .asf.yaml (ghp_branch: gh-pages, ghp_path: /) tells GitHub Pages to serve
# that branch at https://apache.github.io/rai-governor/. ASF self-serve only
# supports branch-based Pages, so the site is pushed to a branch rather than
# deployed with actions/deploy-pages.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Build, without publishing, on pull requests that can change the site,
  # so a broken dependency bump fails before it is merged.
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - ".github/workflows/build-site.yml"

concurrency:
  # Publishes run one at a time; a newer push to the same pull request
  # cancels its older build.
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Named "build" for pull requests and "build and publish" on main.
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'build' || 'build and publish' }}
    if: github.repository == 'apache/rai-governor'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push to gh-pages
    env:
      FOR_GH_PAGES: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Build Docusaurus site
        run: npm run build
        working-directory: website

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" pages
          else
            git init --quiet --initial-branch gh-pages pages
          fi
          # Replace everything except git metadata with the fresh build.
          find pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a website/build/. pages/
          cd pages
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged; nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Publish docs site from ${GITHUB_SHA}"
          git push --quiet "$remote" gh-pages
